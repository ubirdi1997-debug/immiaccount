worker_processes auto;
pid /workspaces/immiaccount/tracker/data/runtime/nginx.pid;
error_log /workspaces/immiaccount/tracker/data/runtime/logs/nginx-error.log;

events {
    worker_connections 4096;
}

http {
    client_body_temp_path /workspaces/immiaccount/tracker/data/runtime/client_temp;
    proxy_temp_path /workspaces/immiaccount/tracker/data/runtime/proxy_temp;
    fastcgi_temp_path /workspaces/immiaccount/tracker/data/runtime/fastcgi_temp;
    uwsgi_temp_path /workspaces/immiaccount/tracker/data/runtime/uwsgi_temp;
    scgi_temp_path /workspaces/immiaccount/tracker/data/runtime/scgi_temp;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    
    access_log /workspaces/immiaccount/tracker/data/runtime/logs/nginx-access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Admin Dashboard (Port 3000 via proxy_pass)
    server {
        listen 8081;
        server_name localhost;
        client_max_body_size 1m;

        location / {
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }
    }

    # VEVO Proxy (Port 3001 via proxy_pass)
    server {
        listen 8080;
        server_name localhost;
        client_max_body_size 1m;

        location / {
            proxy_pass http://127.0.0.1:3001;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }
    }
}
