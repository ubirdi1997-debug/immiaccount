<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - IMM Account</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .login-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
    </style>
</head>
<body class="login-bg min-h-screen flex items-center justify-center">
    <div class="w-full max-w-md mx-4">
        <!-- Login Card -->
        <div class="bg-white rounded-2xl shadow-2xl p-8">
            <div class="text-center mb-8">
                <div class="w-20 h-20 bg-gradient-to-br from-blue-500 to-purple-600 rounded-full flex items-center justify-center mx-auto mb-4">
                    <i class="fas fa-shield-alt text-white text-3xl"></i>
                </div>
                <h1 class="text-2xl font-bold text-gray-800">Admin Portal</h1>
                <p class="text-gray-500 text-sm mt-1">IMM Account Management System</p>
            </div>
            
            <!-- Messages -->
            <div id="messageContainer" class="hidden mb-4">
                <div id="messageBox" class="p-4 rounded-lg"></div>
            </div>
            
            <form action="/login" method="POST" id="loginForm">
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-2">Username</label>
                    <div class="relative">
                        <i class="fas fa-user absolute left-3 top-3 text-gray-400"></i>
                        <input type="text" name="username" placeholder="Enter username" required
                            class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition duration-200">
                    </div>
                </div>
                
                <div class="mb-6">
                    <label class="block text-sm font-medium text-gray-700 mb-2">Password</label>
                    <div class="relative">
                        <i class="fas fa-lock absolute left-3 top-3 text-gray-400"></i>
                        <input type="password" name="password" placeholder="Enter password" required
                            class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition duration-200">
                    </div>
                </div>
                
                <button type="submit" class="w-full bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-700 hover:to-purple-700 text-white font-semibold py-3 px-4 rounded-lg transition duration-200 flex items-center justify-center">
                    <i class="fas fa-sign-in-alt mr-2"></i> Sign In
                </button>
            </form>
            
            <div class="mt-6 text-center">
                <p class="text-xs text-gray-400">
                    <i class="fas fa-lock mr-1"></i> This system uses machine/browser locking for security.
                    First login will bind your account to this browser.
                </p>
            </div>
        </div>
        
        <p class="text-center text-white text-sm mt-6 opacity-80">
            &copy; 2024 IMM Account System. All rights reserved.
        </p>
    </div>
    
    <script>
        // Check for error messages in URL
        const urlParams = new URLSearchParams(window.location.search);
        const error = urlParams.get('error');
        const message = urlParams.get('message');
        
        if (error || message) {
            const messageContainer = document.getElementById('messageContainer');
            const messageBox = document.getElementById('messageBox');
            
            messageContainer.classList.remove('hidden');
            
            if (error) {
                messageBox.className = 'p-4 rounded-lg bg-red-50 border border-red-200';
                messageBox.innerHTML = `
                    <div class="flex items-start">
                        <i class="fas fa-exclamation-circle text-red-600 mt-0.5 mr-2"></i>
                        <div>
                            <p class="text-sm font-medium text-red-800">Access Denied</p>
                            <p class="text-sm text-red-700 mt-1">${decodeURIComponent(error)}</p>
                        </div>
                    </div>
                `;
            } else if (message) {
                messageBox.className = 'p-4 rounded-lg bg-green-50 border border-green-200';
                messageBox.innerHTML = `
                    <div class="flex items-start">
                        <i class="fas fa-check-circle text-green-600 mt-0.5 mr-2"></i>
                        <div>
                            <p class="text-sm font-medium text-green-800">Success</p>
                            <p class="text-sm text-green-700 mt-1">${decodeURIComponent(message)}</p>
                        </div>
                    </div>
                `;
            }
        }
    </script>
</body>
</html>
